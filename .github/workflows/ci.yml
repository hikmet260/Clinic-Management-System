name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/*/pnpm-lock.yaml

      - name: Install server
        run: pnpm -C packages/server install --frozen-lockfile

      - name: Install client
        run: pnpm -C packages/client install --frozen-lockfile

      - name: Typecheck server
        run: pnpm -C packages/server typecheck

      - name: Typecheck client
        run: pnpm -C packages/client typecheck

      - name: Build server
        run: pnpm -C packages/server build

      - name: Build client
        run: pnpm -C packages/client build
